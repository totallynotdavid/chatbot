name: Mise pins

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    # Bash with pipefail makes a failed `gh issue list` stop the step instead of
    # being read as "no issue".
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: Update the pins in mise.toml
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: jdx/mise-action@v5.1.2
        with:
          install: false

      # A failed pin lookup fails this step. The issue below then stays open.
      - run: .github/scripts/check-mise-pins.sh > outdated.md

      - name: Open, update or close the issue
        run: |
          number=$(gh issue list --state open --limit 200 --json number,title |
            jq -r --arg title "$TITLE" 'map(select(.title == $title))[0].number // empty')
          if [[ -s outdated.md ]]; then
            {
              echo "These pins in \`mise.toml\` are behind their latest release:"
              echo
              cat outdated.md
            } > body.md
            if [[ -n $number ]]; then
              gh issue edit "$number" --body-file body.md
            else
              gh issue create --title "$TITLE" --body-file body.md
            fi
          elif [[ -n $number ]]; then
            gh issue close "$number" --comment "Every pin in \`mise.toml\` is current."
          fi
