[tools]
bun = "1.4.3"
postgres = "18.6"

[tasks.install]
description = "Install dependencies from bun.lock"
run = "bun install --frozen-lockfile"

[tasks."lint:js"]
description = "Check code with Biome"
run = ["bunx biome lint", "bunx biome format"]

[tasks."lint:fmt"]
description = "Check Markdown, YAML and JSON formatting with oxfmt"
run = "bunx oxfmt --check '**/*.{md,yml,yaml,json}'"

[tasks.lint]
description = "Run every static check without writing files"
depends = ["lint:*"]

[tasks."fix:js"]
description = "Apply Biome safe fixes and format code"
run = "bunx biome check --write"

[tasks."fix:fmt"]
description = "Format Markdown, YAML and JSON with oxfmt"
run = "bunx oxfmt '**/*.{md,yml,yaml,json}'"

[tasks.fix]
description = "Apply safe fixes and run the formatters"
depends = ["fix:*"]

[tasks.typecheck]
description = "Typecheck every workspace"
run = "bun run --filter '*' typecheck"

# `check` runs the tasks in parallel, so the build and typecheck slow the tests
# past bun's 5s default. bunfig.toml has no key for it.
[tasks.test]
description = "Run the tests that need no service"
run = "bun test --timeout 60000 --path-ignore-patterns '**/*.integration.test.ts'"

[tasks."test:integration"]
description = "Run the tests that need Postgres, from TEST_DATABASE_URL or a local initdb"
run = "bun test --timeout 60000 .integration.test.ts"

[tasks.build]
description = "Build the frontend"
run = "bun run --cwd apps/frontend build"

[tasks.check]
description = "Run every check that needs no service"
depends = ["lint", "typecheck", "test", "build"]
